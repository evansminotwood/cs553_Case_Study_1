name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Clone the HF Spaces repo
          git clone https://huggingface.co/spaces/${{ secrets.HF_SPACE_USERNAME }}/${{ secrets.HF_SPACE_NAME }} hf-spaces
          cd hf-spaces
          
          # Copy files from our repo (excluding .git and .github)
          rsync -av --exclude='.git' --exclude='.github' --exclude='__pycache__' --exclude='.venv' --exclude='*.pyc' ../. .
          
          # Add and commit
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync from GitHub: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_SPACE_USERNAME }}/${{ secrets.HF_SPACE_NAME }}
            echo "SYNC_STATUS=success" >> $GITHUB_ENV
          else
            echo "No changes to sync"
            echo "SYNC_STATUS=no_changes" >> $GITHUB_ENV
          fi

      - name: Notify Discord - Sync Success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            ✅ **HuggingFace Sync Successful**
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            View: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Notify Discord - Sync Failed
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            ❌ **HuggingFace Sync Failed**
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
