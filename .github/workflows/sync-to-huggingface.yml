name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone the HF Spaces repo OUTSIDE this checkout so the rsync below
          # can't ever copy the clone into itself (previously this nested
          # hf-spaces/hf-spaces/hf-spaces/... one level deeper on every run).
          HF_DIR="${RUNNER_TEMP}/hf-spaces"
          rm -rf "$HF_DIR"
          git clone https://huggingface.co/spaces/${{ secrets.HF_SPACE_USERNAME }}/${{ secrets.HF_SPACE_NAME }} "$HF_DIR"

          # Mirror only the files the Space actually needs to run. --delete
          # also clears out anything stale on the Space side (including the
          # nested hf-spaces/ garbage from earlier buggy runs).
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='*.pyc' \
            --exclude='tests' \
            --exclude='pytest.ini' \
            --exclude='*.pdf' \
            ./ "$HF_DIR"/

          cd "$HF_DIR"

          # Add and commit
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync from GitHub: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_SPACE_USERNAME }}/${{ secrets.HF_SPACE_NAME }}
            echo "SYNC_STATUS=success" >> $GITHUB_ENV
          else
            echo "No changes to sync"
            echo "SYNC_STATUS=no_changes" >> $GITHUB_ENV
          fi

      - name: Notify Discord - Sync Success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            ✅ **HuggingFace Sync Successful**
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            View: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Notify Discord - Sync Failed
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            ❌ **HuggingFace Sync Failed**
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
